version: '3.4'

services:
  plantdb_qa:
    image: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "25441:5432"
    networks:
      forgetmenot_qa:
    volumes:
      - plant_db_qa_storage:/var/lib/postgresql/data
  plantservice_qa:
    ports:
      - "290:8080"
    environment:
      VIRTUAL_HOST: forgetmenotqa.uplifttech.org, forgetmenotqa4.uplifttech.org
      VIRTUAL_PORT: 8080
      VIRTUAL_PROTO: http
      LETSENCRYPT_HOST: forgetmenotqa.uplifttech.org, forgetmenotqa4.uplifttech.org
      LETSENCRYPT_EMAIL: wthompson@uplifttech.org
      ConnectionString__DefaultConnection: ${ConnectionString__DefaultConnection}
      Keycloak__OAuthClientId: ${Keycloak__OAuthClientId}
      Keycloak__OAuthClientSecret: ${Keycloak__OAuthClientSecret}
      Keycloak__Authority: ${Keycloak__Authority}
      Keycloak__Audience: ${Keycloak__Audience}
      ASPNETCORE_ENVIRONMENT: Development
    restart: always
    image: plantservice_qa
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      forgetmenot_qa:
    depends_on:
      plantdb_qa:
        condition: service_healthy

networks:
  forgetmenot_qa:
    external: true

volumes:
  plant_db_qa_storage:
    external: true
